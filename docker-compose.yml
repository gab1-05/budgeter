services:
  mongodb:
    image: mongo:7
    container_name: expense-tracker-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: expenseTracker
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: prod
    container_name: expense-tracker-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      MONGO_URI: mongodb://mongodb:27017/expenseTracker
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: worker
    container_name: expense-tracker-worker
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017/expenseTracker
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./server:/app
      - /app/node_modules

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: expense-tracker-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ""
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_started

volumes:
  mongodb_data: